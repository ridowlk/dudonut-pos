<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DuDonut</title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS & React -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 antialiased">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://liryzeceojiqwukbusnp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XifJlJ5R_fugxolUGhMUsg_PruMWstF';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { useState, useEffect, useRef } = React;

        const formatRupiah = (number) => 'Rp ' + new Intl.NumberFormat('id-ID').format(number || 0);

        const AdminApp = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [adminUser, setAdminUser] = useState(null);
            
            const [products, setProducts] = useState([]);
            const [productModalOpen, setProductModalOpen] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);

            const [formName, setFormName] = useState('');
            const [formPriceRaw, setFormPriceRaw] = useState('');
            const [formPriceFormatted, setFormPriceFormatted] = useState('');
            const [formStock, setFormStock] = useState('10');
            const [formImage, setFormImage] = useState('img/umami.png');
            const [formTag, setFormTag] = useState('');

            const [transactions, setTransactions] = useState([]);
            const [timeRange, setTimeRange] = useState('daily');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Diletakkan di luar useEffect agar bisa dipanggil oleh CRUD
            const fetchAdminData = async () => {
                const { data: prodData } = await supabase
                    .from('products')
                    .select('*')
                    .order('id', { ascending: true });
                if (prodData) setProducts(prodData);

                const { data: trxData } = await supabase
                    .from('transactions')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (trxData) setTransactions(trxData);
            };

            useEffect(() => {
                const savedUser = localStorage.getItem('dudonut_active_cashier');
                if (!savedUser) {
                    window.location.href = 'login.html';
                    return;
                }
                const parsed = JSON.parse(savedUser);
                if (parsed.role !== 'admin') {
                    window.location.href = 'index.html';
                    return;
                }
                setAdminUser(parsed);
                fetchAdminData();
            }, []);

            const handlePriceChange = (e) => {
                const rawValue = e.target.value.replace(/\D/g, '');
                if (rawValue === '') {
                    setFormPriceRaw('');
                    setFormPriceFormatted('');
                } else {
                    setFormPriceRaw(rawValue);
                    setFormPriceFormatted('Rp ' + new Intl.NumberFormat('id-ID').format(parseInt(rawValue, 10)));
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const openAddModal = () => {
                setEditingProduct(null);
                setFormName('');
                setFormPriceRaw('');
                setFormPriceFormatted('');
                setFormStock('10');
                setFormImage('img/umami.png');
                setFormTag('');
                setProductModalOpen(true);
            };

            const openEditModal = (p) => {
                setEditingProduct(p);
                setFormName(p.name);
                setFormPriceRaw(p.price.toString());
                setFormPriceFormatted(formatRupiah(p.price));
                setFormStock(p.stock !== undefined ? p.stock.toString() : '0');
                setFormImage(p.image);
                setFormTag(p.tag || '');
                setProductModalOpen(true);
            };

            useEffect(() => {
                if (activeTab === 'dashboard' && chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();

                    let labels = timeRange === 'daily' 
                        ? ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Ming']
                        : timeRange === 'weekly' ? ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4']
                        : ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

                    let dataValues = timeRange === 'daily'
                        ? [120000, 150000, 180000, 210000, 320000, 450000, 390000]
                        : [1200000, 1800000, 1500000, 2200000];

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [{
                                label: 'Penjualan (Rp)',
                                data: dataValues,
                                borderColor: '#ff1493',
                                backgroundColor: 'rgba(255, 20, 147, 0.1)',
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }
            }, [activeTab, timeRange]);

            const handleLogout = () => {
                localStorage.removeItem('dudonut_active_cashier');
                window.location.href = 'login.html';
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                const productData = {
                    name: formName.trim(),
                    price: parseInt(formPriceRaw, 10) || 0,
                    stock: parseInt(formStock, 10) || 0,
                    image: formImage || 'img/umami.png',
                    tag: formTag.trim()
                };

                if (editingProduct) {
                    await supabase
                        .from('products')
                        .update(productData)
                        .eq('id', editingProduct.id);
                } else {
                    await supabase
                        .from('products')
                        .insert([productData]);
                }

                await fetchAdminData();
                setProductModalOpen(false);
            };

            const handleDeleteProduct = async (id) => {
                if (confirm('Yakin ingin menghapus produk ini?')) {
                    await supabase
                        .from('products')
                        .delete()
                        .eq('id', id);
                    await fetchAdminData();
                }
            };

            if (!adminUser) return null;

            return (
                <div className="flex h-screen w-full bg-gray-50 overflow-hidden">
                    <aside className="w-64 bg-white border-r border-gray-200 p-5 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center space-x-2 mb-6">
                                <img src="img/logo.png" alt="Logo" className="h-8" />
                                <span className="text-xs font-bold text-[#ff1493] bg-pink-50 px-2 py-0.5 rounded-full">ADMIN</span>
                            </div>
                            <nav className="space-y-1 text-xs font-bold">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-3 py-2.5 rounded-xl ${activeTab === 'dashboard' ? 'bg-[#ff1493] text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Dashboard & Grafik</button>
                                <button onClick={() => setActiveTab('products')} className={`w-full text-left px-3 py-2.5 rounded-xl ${activeTab === 'products' ? 'bg-[#ff1493] text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Data Produk (CRUD)</button>
                                <button onClick={() => setActiveTab('transactions')} className={`w-full text-left px-3 py-2.5 rounded-xl ${activeTab === 'transactions' ? 'bg-[#ff1493] text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Riwayat Pesanan</button>
                            </nav>
                        </div>
                        <button onClick={handleLogout} className="text-xs font-bold text-red-500 hover:bg-red-50 p-2 rounded-xl text-left">Keluar</button>
                    </aside>

                    <main className="flex-1 p-6 overflow-y-auto custom-scrollbar">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-bold">Grafik & Statistik Penjualan</h2>
                                    <div className="flex bg-gray-200 p-1 rounded-lg text-xs font-bold">
                                        <button onClick={() => setTimeRange('daily')} className={`px-3 py-1 rounded ${timeRange === 'daily' ? 'bg-white text-[#ff1493]' : 'text-gray-600'}`}>Harian</button>
                                        <button onClick={() => setTimeRange('weekly')} className={`px-3 py-1 rounded ${timeRange === 'weekly' ? 'bg-white text-[#ff1493]' : 'text-gray-600'}`}>Mingguan</button>
                                        <button onClick={() => setTimeRange('monthly')} className={`px-3 py-1 rounded ${timeRange === 'monthly' ? 'bg-white text-[#ff1493]' : 'text-gray-600'}`}>Bulanan</button>
                                    </div>
                                </div>
                                <div className="bg-white p-5 rounded-2xl border h-72">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            </div>
                        )}

                        {activeTab === 'products' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-bold">Data Produk (CRUD)</h2>
                                    <button onClick={openAddModal} className="bg-[#ff1493] text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-pink-600">+ Tambah Produk</button>
                                </div>
                                <div className="bg-white rounded-2xl border overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-gray-50 border-b font-bold text-gray-500">
                                            <tr>
                                                <th className="p-3">Gambar</th>
                                                <th className="p-3">Nama</th>
                                                <th className="p-3">Harga</th>
                                                <th className="p-3">Stok</th>
                                                <th className="p-3">Tag / Status</th>
                                                <th className="p-3 text-center">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {products.map(p => {
                                                const isOutOfStock = p.stock <= 0;
                                                const displayTag = isOutOfStock ? 'KOSONG' : (p.tag || '-');

                                                return (
                                                    <tr key={p.id}>
                                                        <td className="p-3">
                                                            <img src={p.image} alt={p.name} className="w-10 h-10 object-contain rounded-lg border bg-gray-50" />
                                                        </td>
                                                        <td className="p-3 font-bold">{p.name}</td>
                                                        <td className="p-3 text-[#ff1493] font-bold">{formatRupiah(p.price)}</td>
                                                        <td className="p-3 font-semibold">{p.stock} pcs</td>
                                                        <td className="p-3">
                                                            <span className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold ${isOutOfStock ? 'bg-red-100 text-red-600' : 'bg-pink-100 text-[#ff1493]'}`}>
                                                                {displayTag}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-center space-x-2">
                                                            <button onClick={() => openEditModal(p)} className="text-amber-600 font-bold">Edit</button>
                                                            <button onClick={() => handleDeleteProduct(p.id)} className="text-red-500 font-bold">Hapus</button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-bold">Riwayat Transaksi Kasir</h2>
                                <div className="bg-white rounded-2xl border overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-gray-50 border-b font-bold text-gray-500">
                                            <tr>
                                                <th className="p-3">ID</th>
                                                <th className="p-3">Kasir</th>
                                                <th className="p-3">Tanggal</th>
                                                <th className="p-3">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {transactions.map(t => (
                                                <tr key={t.id}>
                                                    <td className="p-3 font-mono font-bold">{t.id}</td>
                                                    <td className="p-3">{t.cashier_name}</td>
                                                    <td className="p-3">{new Date(t.created_at).toLocaleString('id-ID')}</td>
                                                    <td className="p-3 text-[#ff1493] font-bold">{formatRupiah(t.total)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {productModalOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-xl">
                                <h3 className="font-extrabold text-base text-gray-800">{editingProduct ? 'Edit Produk' : 'Tambah Produk'}</h3>
                                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-gray-400 mb-1">Nama Produk</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Contoh: DuDon Oreo 2pcs"
                                            value={formName} 
                                            onChange={e => setFormName(e.target.value)} 
                                            className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-400 outline-none" 
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-gray-400 mb-1">Harga (Rp)</label>
                                        <input 
                                            type="text" 
                                            required 
                                            placeholder="Rp 7.000"
                                            value={formPriceFormatted} 
                                            onChange={handlePriceChange} 
                                            className="w-full p-2.5 border rounded-xl font-bold text-[#ff1493] focus:ring-2 focus:ring-pink-400 outline-none" 
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-gray-400 mb-1">Jumlah Stok</label>
                                        <input 
                                            type="number" 
                                            required 
                                            min="0"
                                            placeholder="0"
                                            value={formStock} 
                                            onChange={e => setFormStock(e.target.value)} 
                                            className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-400 outline-none" 
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-gray-400 mb-1">Gambar Produk</label>
                                        <div className="space-y-2">
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={handleImageUpload} 
                                                className="w-full text-[11px] text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-[#ff1493] hover:file:bg-pink-100 cursor-pointer" 
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="Atau masukkan path URL gambar (img/oreo.png)"
                                                value={formImage} 
                                                onChange={e => setFormImage(e.target.value)} 
                                                className="w-full p-2 border rounded-xl focus:ring-2 focus:ring-pink-400 outline-none text-[11px]" 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-gray-400 mb-1">Tag / Label (Opsional)</label>
                                        <input 
                                            type="text" 
                                            placeholder="BEST SELLER! / NEW PRODUCT!" 
                                            value={formTag} 
                                            onChange={e => setFormTag(e.target.value)} 
                                            className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-400 outline-none" 
                                        />
                                    </div>

                                    <div className="flex gap-2 pt-3">
                                        <button type="button" onClick={() => setProductModalOpen(false)} className="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-[#ff1493] text-white rounded-xl font-bold hover:bg-pink-600">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
