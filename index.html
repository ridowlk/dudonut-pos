<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - DuDonut</title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        brand: ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '#ff1493',
                            lightPink: '#ff2d9b',
                            yellow: '#facc15',
                            bgGray: '#e5e7eb'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif; 
            background-image: url(img/bg.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type='number'] {
            -moz-appearance: textfield;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .animate-toast {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-pink-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://liryzeceojiqwukbusnp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XifJlJ5R_fugxolUGhMUsg_PruMWstF';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { useState, useEffect } = React;

        const formatRupiah = (number) => {
            if (!number && number !== 0) return 'Rp -';
            return 'Rp' + new Intl.NumberFormat('id-ID').format(number);
        };

        const App = () => {
            const [activeCashier, setActiveCashier] = useState(null);
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [cashReceived, setCashReceived] = useState('');
            const [discountPercent, setDiscountPercent] = useState('');

            const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
            const [isSuccessModalOpen, setIsSuccessModalOpen] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [toast, setToast] = useState(null);

            const refreshProducts = async () => {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('id', { ascending: true });
                    
                if (!error && data) {
                    setProducts(data);
                }
            };

            useEffect(() => {
                const savedCashier = localStorage.getItem('dudonut_active_cashier');
                if (!savedCashier) {
                    window.location.href = 'login.html';
                    return;
                }
                const parsedCashier = JSON.parse(savedCashier);
                
                if (parsedCashier.role === 'admin') {
                    window.location.href = 'dashboard.html';
                    return;
                }
                setActiveCashier(parsedCashier);
                refreshProducts();

                // Sinkronisasi Realtime dengan Supabase
                const channel = supabase
                    .channel('products-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
                        refreshProducts();
                    })
                    .subscribe();

                window.addEventListener('focus', refreshProducts);

                return () => {
                    supabase.removeChannel(channel);
                    window.removeEventListener('focus', refreshProducts);
                };
            }, []);

            const handleLogout = () => {
                localStorage.removeItem('dudonut_active_cashier');
                window.location.href = 'login.html';
            };

            const showToast = (type, title, message) => {
                setToast({ type, title, message });
                setTimeout(() => setToast(null), 4000);
            };

            const subTotal = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 0)), 0);
            const parsedDiscountPercent = Math.min(100, Math.max(0, parseFloat(discountPercent) || 0));
            const discountAmount = (subTotal * parsedDiscountPercent) / 100;
            const total = subTotal - discountAmount;
            const cash = parseInt(cashReceived.replace(/\D/g, '')) || 0;
            const change = cash > 0 ? cash - total : 0;

            const addToCart = (product) => {
                if (product.stock <= 0) {
                    showToast('error', 'Stok Kosong!', 'Produk ini sedang tidak tersedia.');
                    return;
                }

                setCart(prevCart => {
                    const existingItem = prevCart.find(item => item.id === product.id);
                    const currentQty = existingItem ? existingItem.quantity : 0;

                    if (currentQty + 1 > product.stock) {
                        showToast('error', 'Stok Tidak Mencukupi!', `Hanya tersisa ${product.stock} pcs.`);
                        return prevCart;
                    }

                    if (existingItem) {
                        return prevCart.map(item => 
                            item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
                        );
                    }
                    return [...prevCart, { ...product, quantity: 1 }];
                });
            };

            const updateQuantity = (id, delta) => {
                const targetProduct = products.find(p => p.id === id);
                setCart(prevCart => {
                    return prevCart.map(item => {
                        if (item.id === id) {
                            const newQuantity = (item.quantity || 0) + delta;
                            if (targetProduct && newQuantity > targetProduct.stock) {
                                showToast('error', 'Stok Terbatas!', `Maksimal pembelian ${targetProduct.stock} pcs.`);
                                return item;
                            }
                            return newQuantity > 0 ? { ...item, quantity: newQuantity } : null;
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const handleQuantityChange = (id, value) => {
                if (value === '') {
                    setCart(prevCart => prevCart.map(item => item.id === id ? { ...item, quantity: '' } : item));
                    return;
                }
                const numVal = parseInt(value, 10);
                const targetProduct = products.find(p => p.id === id);
                
                if (!isNaN(numVal) && numVal >= 0) {
                    if (targetProduct && numVal > targetProduct.stock) {
                        showToast('error', 'Stok Terbatas!', `Maksimal pembelian ${targetProduct.stock} pcs.`);
                        return;
                    }
                    setCart(prevCart => prevCart.map(item => item.id === id ? { ...item, quantity: numVal } : item));
                }
            };

            const removeItem = (id) => {
                setCart(prevCart => prevCart.filter(item => item.id !== id));
            };

            const handleCashChange = (e) => {
                const val = e.target.value;
                if (val === '' || /^[0-9\b]+$/.test(val)) {
                    setCashReceived(val);
                }
            };

            const handleDiscountChange = (e) => {
                const val = e.target.value;
                if (val === '') {
                    setDiscountPercent('');
                    return;
                }
                let numVal = parseFloat(val);
                if (!isNaN(numVal)) {
                    if (numVal > 100) numVal = 100;
                    if (numVal < 0) numVal = 0;
                    setDiscountPercent(numVal.toString());
                }
            };

            const handlePayClick = () => {
                if (cart.length === 0) {
                    showToast('error', 'Keranjang Masih Kosong!', 'Silakan pilih produk terlebih dahulu.');
                    return;
                }
                const hasZeroOrEmpty = cart.some(item => !item.quantity || item.quantity <= 0);
                if (hasZeroOrEmpty) {
                    showToast('error', 'Jumlah Item Tidak Valid!', 'Jumlah item di keranjang tidak boleh 0 atau kosong.');
                    return;
                }
                if (cash < total) {
                    showToast('error', 'Uang pembayaran kurang!', 'Pastikan nominal tunai mencukupi total pembayaran.');
                    return;
                }
                setIsConfirmModalOpen(true);
            };

            const handleConfirmTransaction = async () => {
                setIsProcessing(true);
                const trxId = 'TRX-' + Date.now();

                // 1. Simpan transaksi ke Supabase
                const { error: trxError } = await supabase
                    .from('transactions')
                    .insert([{
                        id: trxId,
                        cashier_name: activeCashier?.name || 'Unknown',
                        cashier_username: activeCashier?.username || 'Unknown',
                        items: cart,
                        sub_total: subTotal,
                        discount_percent: parsedDiscountPercent,
                        discount_amount: discountAmount,
                        total: total,
                        cash: cash,
                        change: change
                    }]);

                if (trxError) {
                    setIsProcessing(false);
                    showToast('error', 'Gagal Menyimpan!', trxError.message);
                    return;
                }

                // 2. Potong stok masing-masing produk di Supabase
                for (const item of cart) {
                    const targetProduct = products.find(p => p.id === item.id);
                    if (targetProduct) {
                        const newStock = Math.max(0, targetProduct.stock - item.quantity);
                        await supabase
                            .from('products')
                            .update({ stock: newStock })
                            .eq('id', item.id);
                    }
                }

                await refreshProducts();
                setIsProcessing(false);
                setIsConfirmModalOpen(false);
                setIsSuccessModalOpen(true);
                showToast('success', 'Telah berhasil terbayar!', 'Transaksi dicatat atas nama kasir: ' + activeCashier?.name);
            };

            const handleCloseSuccess = () => {
                setIsSuccessModalOpen(false);
                setCart([]);
                setCashReceived('');
                setDiscountPercent('');
            };

            if (!activeCashier) return null;

            return (
                <div className="flex flex-col h-screen w-full bg-transparent overflow-hidden relative">
                    
                    {toast && (
                        <div className="fixed top-5 right-5 z-50 flex items-center animate-toast max-w-sm md:max-w-md w-full shadow-lg rounded-2xl overflow-hidden">
                            {toast.type === 'success' ? (
                                <div className="bg-[#00c853] text-white px-5 py-4 rounded-2xl w-full flex items-center justify-between">
                                    <div className="flex items-center space-x-3.5 pr-2">
                                        <div className="w-10 h-10 rounded-full border-2 border-white flex items-center justify-center flex-shrink-0">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                            </svg>
                                        </div>
                                        <div>
                                            <h4 className="font-extrabold text-lg leading-tight">{toast.title}</h4>
                                            <p className="text-sm opacity-90 font-medium leading-tight">{toast.message}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setToast(null)} className="text-white hover:opacity-75 transition-opacity self-start -mt-1 -mr-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            ) : (
                                <div className="bg-[#e5484d] text-white px-5 py-4 rounded-2xl w-full flex items-center justify-between">
                                    <div className="flex items-center space-x-3.5 pr-2">
                                        <div className="w-10 h-10 flex items-center justify-center flex-shrink-0">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </div>
                                        <div>
                                            <h4 className="font-extrabold text-lg leading-tight">{toast.title}</h4>
                                            <p className="text-sm opacity-90 font-medium leading-tight">{toast.message}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setToast(null)} className="text-white hover:opacity-75 transition-opacity self-start -mt-1 -mr-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    <header className="bg-[#ff1493] text-white px-6 py-2.5 flex items-center justify-between shadow-md w-full flex-shrink-0 z-30">
                        <div className="flex items-center space-x-4">
                            <img 
                                src="img/logo.png" 
                                alt="DuDonut Logo" 
                                className="h-10 md:h-12 w-auto object-contain drop-shadow-sm select-none"
                            />
                        </div>

                        <div className="flex items-center space-x-3">
                            <div className="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-xl flex items-center space-x-2">
                                <div className="w-7 h-7 rounded-full bg-white text-[#ff1493] font-black text-xs flex items-center justify-center">
                                    {activeCashier.name.charAt(0)}
                                </div>
                                <div className="text-left hidden sm:block">
                                    <p className="text-xs font-bold leading-tight">{activeCashier.name}</p>
                                    <p className="text-[10px] text-pink-100 font-medium leading-tight">Kasir Active</p>
                                </div>
                            </div>
                            <button 
                                onClick={handleLogout}
                                className="bg-red-500 hover:bg-red-600 text-white p-2 rounded-xl text-xs font-bold transition-colors flex items-center gap-1"
                                title="Keluar / Logout"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                <span className="hidden md:inline">Keluar</span>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 flex flex-col md:flex-row p-4 md:p-6 gap-6 overflow-hidden w-full">

                        <div className="flex-1 flex flex-col justify-between overflow-y-auto custom-scrollbar pr-2">
                            <div className="grid grid-cols-2 gap-5">
                                {products.map(product => {
                                    const isOutOfStock = product.stock <= 0;
                                    const displayTag = isOutOfStock ? 'KOSONG' : product.tag;

                                    return (
                                        <div 
                                            key={product.id} 
                                            onClick={() => addToCart(product)}
                                            className={`bg-white/90 backdrop-blur-sm rounded-2xl p-4 shadow-sm transition-all flex flex-col items-center border border-gray-100 min-h-[220px] justify-between relative ${isOutOfStock ? 'opacity-65 cursor-not-allowed select-none' : 'hover:shadow-md cursor-pointer'}`}
                                        >
                                            <div className="h-6 flex items-center justify-center">
                                                {displayTag ? (
                                                    <span className={`text-[11px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm whitespace-nowrap ${isOutOfStock ? 'bg-red-600 text-white' : 'bg-[#ff1493] text-white'}`}>
                                                        {displayTag}
                                                    </span>
                                                ) : null}
                                            </div>

                                            <div className="w-full h-28 md:h-32 flex items-center justify-center my-1">
                                                <img 
                                                    src={product.image} 
                                                    alt={product.name} 
                                                    className="max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105" 
                                                />
                                            </div>

                                            <div className="text-center w-full">
                                                <h3 className="text-xs md:text-sm font-bold text-gray-800 leading-tight mb-0.5">{product.name}</h3>
                                                <p className="text-[10px] text-gray-400 font-semibold mb-1">Stok: {product.stock} pcs</p>
                                                <span className="inline-block bg-amber-200/80 text-gray-800 text-xs font-bold px-3 py-0.5 rounded-full">
                                                    {formatRupiah(product.price)}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="w-full md:w-[400px] lg:w-[640px] bg-white/95 backdrop-blur-sm rounded-2xl p-5 shadow-sm border border-gray-200 flex flex-col justify-between h-full flex-shrink-0">

                            <div className="flex flex-col min-h-0 flex-1">
                                <div className="flex items-center space-x-3 pb-3 border-b border-gray-200 flex-shrink-0">
                                    <div className="border border-amber-400 p-1.5 rounded-md text-amber-500">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                                        </svg>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800">Keranjang</h2>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar my-3 space-y-2 pr-1">
                                    {cart.length === 0 ? (
                                        <div className="text-gray-400 text-sm py-12 text-center italic">
                                            Belum ada pesanan yang dipilih
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex justify-between items-center text-sm py-2 border-b border-gray-100 gap-2">
                                                <div className="flex-1 pr-1 min-w-0">
                                                    <span className="font-semibold text-gray-700 block truncate">{item.name}</span>
                                                    <span className="text-xs text-gray-400">{formatRupiah(item.price)}</span>
                                                </div>

                                                <div className="flex items-center space-x-1.5 flex-shrink-0">
                                                    <button 
                                                        onClick={() => updateQuantity(item.id, -1)} 
                                                        className="w-7 h-7 bg-gray-100 rounded-lg text-gray-600 font-bold hover:bg-gray-200 flex items-center justify-center transition-colors"
                                                    >
                                                        -
                                                    </button>

                                                    <input 
                                                        type="number"
                                                        value={item.quantity}
                                                        onChange={(e) => handleQuantityChange(item.id, e.target.value)}
                                                        className="w-10 h-7 bg-gray-50 border border-gray-200 rounded-lg text-center font-bold text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:bg-white"
                                                        min="1"
                                                    />

                                                    <button 
                                                        onClick={() => updateQuantity(item.id, 1)} 
                                                        className="w-7 h-7 bg-gray-100 rounded-lg text-gray-600 font-bold hover:bg-gray-200 flex items-center justify-center transition-colors"
                                                    >
                                                        +
                                                    </button>

                                                    <button 
                                                        onClick={() => removeItem(item.id)}
                                                        className="w-7 h-7 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-lg flex items-center justify-center transition-colors ml-1"
                                                        title="Hapus item"
                                                    >
                                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                                            <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            <div className="border-t border-gray-200 pt-3 space-y-2 flex-shrink-0">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-xl text-gray-800">Sub Total</h3>
                                    <span className="font-semibold text-gray-700 text-lg">
                                        {cart.length > 0 ? formatRupiah(subTotal) : 'Rp -'}
                                    </span>
                                </div>

                                <div className="flex justify-between items-center text-base text-gray-600">
                                    <label htmlFor="discountInput" className="font-medium">Diskon (%)</label>
                                    <div className="flex items-center space-x-1">
                                        <input 
                                            id="discountInput"
                                            type="number"
                                            value={discountPercent}
                                            onChange={handleDiscountChange}
                                            placeholder="0"
                                            min="0"
                                            max="100"
                                            className="w-16 h-8 bg-gray-100 border border-gray-200 rounded-lg text-right font-bold text-sm text-gray-800 px-2 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:bg-white"
                                        />
                                        <span className="font-bold text-gray-600">%</span>
                                    </div>
                                </div>

                                <div className="flex justify-between text-base font-bold text-[#ff1493]">
                                    <span>Total</span>
                                    <span>{cart.length > 0 ? formatRupiah(total) : 'Rp -'}</span>
                                </div>

                                <div className="pt-2 border-t border-gray-200">
                                    <div className="flex justify-between items-center mb-1 text-sm">
                                        <label className="font-bold text-gray-800">Uang diterima</label>
                                        <span className="text-xs font-semibold text-gray-500">
                                            Kembalian {formatRupiah(change)}
                                        </span>
                                    </div>
                                    <input 
                                        type="text" 
                                        value={cashReceived}
                                        onChange={handleCashChange}
                                        placeholder="Mis. 5000"
                                        className="w-full bg-gray-100 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-300"
                                    />
                                </div>

                                <button 
                                    onClick={handlePayClick}
                                    className="w-full mt-3 border-2 border-[#ff1493] text-[#ff1493] hover:bg-pink-50 font-bold py-2.5 rounded-xl transition-all text-center text-sm"
                                >
                                    Bayar
                                </button>
                            </div>
                        </div>

                    </div>

                    {isConfirmModalOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-xl p-5">
                                <h2 className="text-center text-lg font-bold text-gray-800 mb-1">Siap Bayar?</h2>
                                <p className="text-center text-xs text-gray-500 mb-3">Kasir: <span className="font-bold text-gray-700">{activeCashier.name}</span></p>

                                <div className="mb-4">
                                    <p className="text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Rincian Pesanan</p>
                                    <div className="max-h-36 overflow-y-auto custom-scrollbar border border-gray-100 rounded-lg p-2 bg-gray-50/50 space-y-1.5">
                                        {cart.map(item => (
                                            <div key={item.id} className="flex justify-between items-center text-xs">
                                                <div className="flex-1 pr-2 truncate">
                                                    <span className="font-semibold text-gray-700">{item.name}</span>
                                                    <span className="text-gray-400 ml-1">x{item.quantity}</span>
                                                </div>
                                                <span className="font-bold text-gray-800">{formatRupiah(item.price * (item.quantity || 0))}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="text-sm space-y-2 mb-5 pt-2 border-t border-gray-100">
                                    <div className="flex justify-between text-gray-600">
                                        <span>Sub Total:</span>
                                        <span>{formatRupiah(subTotal)}</span>
                                    </div>
                                    {parsedDiscountPercent > 0 && (
                                        <div className="flex justify-between text-gray-600">
                                            <span>Diskon ({parsedDiscountPercent}%):</span>
                                            <span className="text-red-500">-{formatRupiah(discountAmount)}</span>
                                        </div>
                                    )}
                                    <div className="flex justify-between font-bold text-gray-800 pt-1 border-t border-dashed border-gray-200">
                                        <span>Total Tagihan:</span>
                                        <span className="text-[#ff1493]">{formatRupiah(total)}</span>
                                    </div>
                                    <div className="flex justify-between text-gray-600">
                                        <span>Uang Tunai:</span>
                                        <span>{formatRupiah(cash)}</span>
                                    </div>
                                    <div className="flex justify-between text-gray-600">
                                        <span>Kembalian:</span>
                                        <span>{formatRupiah(change)}</span>
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setIsConfirmModalOpen(false)} 
                                        disabled={isProcessing}
                                        className="flex-1 py-2.5 bg-gray-100 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-200 transition-colors"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={handleConfirmTransaction} 
                                        disabled={isProcessing}
                                        className="flex-1 py-2.5 bg-[#ff1493] text-white rounded-xl text-xs font-bold hover:bg-pink-600 transition-colors disabled:opacity-60"
                                    >
                                        {isProcessing ? 'Menyimpan...' : 'Konfirmasi'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isSuccessModalOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-xs text-center p-6 shadow-2xl">
                                <div className="text-[#ff1493] text-4xl mb-2">♥</div>
                                <h3 className="text-xl font-bold text-gray-800 mb-1">Terima Kasih!</h3>
                                <p className="text-xs text-gray-500 mb-1">Pembayaran telah berhasil diproses.</p>
                                <p className="text-[11px] font-semibold text-pink-500 mb-4">Melayani: {activeCashier.name}</p>
                                <button 
                                    onClick={handleCloseSuccess} 
                                    className="w-full py-2.5 bg-[#ff1493] text-white font-bold rounded-xl text-xs hover:bg-pink-600"
                                >
                                    Selesai
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
